[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-ops"
version = "0.1.4"
description = "Open-source early-stage drug discovery toolkit: compound triage, target-to-hit modelling, and structure-based virtual screening."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Subhendra Basu" }]
keywords = ["cheminformatics", "drug-discovery", "qsar", "docking", "admet", "rdkit"]

dependencies = [
    "rdkit>=2023.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pharma-ops = "pharma_ops.cli:main"

[tool.setuptools.packages.find]
include = ["pharma_ops*"]

[tool.setuptools.package-data]
pharma_ops = ["templates/*.html", "data/*.txt"]
